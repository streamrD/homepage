<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #07060a; }

  .card { position: relative; width: 1200px; height: 630px; }

  .card img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 42%;
  }

  /* darken the left third so the type sits on something */
  .scrim {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.74) 20%,
                              rgba(0,0,0,0.3) 38%, rgba(0,0,0,0) 56%),
      linear-gradient(to right, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 46%);
  }

  .type {
    position: absolute;
    left: 68px;
    bottom: 58px;
    font-family: 'Share Tech Mono', monospace;
    text-transform: lowercase;
  }

  .t {
    color: #f0e5d2;
    font-size: 62px;
    letter-spacing: 0.3em;
    text-shadow: 0 2px 26px rgba(0,0,0,0.8);
  }

  .s {
    margin-top: 20px;
    color: #c6bbad;
    font-size: 17px;
    letter-spacing: 0.2em;
    line-height: 1.85;
    text-shadow: 0 1px 18px rgba(0,0,0,0.9);
  }

  .s span { color: #8a8078; }
</style>
</head>
<body>
  <div class="card">
    <img src="img/lights-01.jpg" alt="">
    <div class="scrim"></div>
    <div class="type">
      <div class="t">light studies</div>
      <div class="s">
        james vincent moore (jimmy)<br>
        <span>long exposures on 2 1/4-inch film · detroit, mi · early–mid 1960s</span>
      </div>
    </div>
  </div>
</body>
</html>
