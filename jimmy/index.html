<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #07060a;
    color: #cfc6bd;
    font-family: 'Share Tech Mono', 'Courier New', monospace;
    overflow: hidden;
  }

  /* ---------- full-bleed background plates ---------- */

  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    transition: opacity 900ms ease, filter 900ms ease;
  }

  body.lit #stage { opacity: 0.07; filter: saturate(0.5); }

  .plate {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 1100ms ease;
  }

  /* Full strength while the opening runs — three photographs at full size,
     fading one into the next, no growing. */
  .plate.on  { opacity: 1; }
  .plate.out { opacity: 0; }

  /* Then the last one steps back to be the room rather than the subject.
     body.ready is added at the same instant the row is released, so the dim
     and the glide are one gesture rather than two events. */
  body.ready .plate.on { opacity: var(--rest, 0.26); }

  /* A square the size of the viewport's long edge — at scale 1 it covers the
     screen exactly. No burst any more: it simply fades up. */
  .plate img {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100vmax;
    height: 100vmax;
    margin: -50vmax 0 0 -50vmax;
    object-fit: cover;
    display: block;
  }

  /* the plate that comes to rest breathes, very slowly */
  .plate.resting img {
    transition: none;
    animation: drift 54s ease-in-out infinite alternate;
  }

  @keyframes drift {
    from { transform: scale(1.00) translate3d(0, 0, 0); }
    to   { transform: scale(1.07) translate3d(-1.2%, 1%, 0); }
  }

  /* a whisper of film grain, background only — never over an enlargement */
  #grain {
    position: fixed;
    inset: -50%;
    pointer-events: none;
    opacity: 0;
    mix-blend-mode: overlay;
    transition: opacity 1.4s ease;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.5'/></svg>");
  }

  body.ready #grain { opacity: 0.16; }
  body.lit #grain { opacity: 0; }

  /* darkening at both bottom corners, so the row and the credit always read
     whichever photograph is standing behind them */
  #shade {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 46vh;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease;
    background:
      radial-gradient(ellipse 44% 62% at 92% 90%, rgba(0,0,0,0.68), rgba(0,0,0,0) 100%),
      radial-gradient(ellipse 40% 52% at 4% 94%, rgba(0,0,0,0.62), rgba(0,0,0,0) 100%);
  }

  body.ready #shade { opacity: 1; }
  body.lit   #shade { opacity: 0; }

  /* ---------- the thumbnail row ---------- */

  /* The five sit in the middle of the screen now, at a size worth looking
     at, rather than filed in a corner. */
  #rail {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    gap: clamp(9px, 1.9vw, 30px);
    z-index: 3;
    transition: opacity 500ms ease;
  }

  body.lit #rail { opacity: 0; pointer-events: none; }

  .thumb {
    position: relative;
    width:  clamp(54px, 11.4vw, 176px);
    height: clamp(54px, 11.4vw, 176px);
    padding: 0;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 2px;
    background: #0a0809;
    cursor: pointer;
    touch-action: manipulation;
    opacity: 0;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.65);
    /* The original's start state, unchanged: carried out to a point, turned,
       and shrunk. What makes it read as one motion rather than five is that
       they all travel — a spin in place has nothing to be believable about. */
    transform: translate(var(--dx, 0px), var(--dy, 0px))
               scale(0.42) rotate(var(--rot, 0deg));
  }

  .thumb.animate {
    /* a little past 1 on the curve, so each one settles rather than arrives */
    transition:
      transform 1250ms cubic-bezier(0.16, 0.9, 0.22, 1),
      opacity 700ms ease,
      border-color 260ms ease,
      box-shadow 260ms ease;
  }

  .thumb.settled {
    opacity: 1;
    transform: translate(0, 0) scale(1) rotate(0deg);
  }

  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: brightness(0.86) saturate(0.94);
    transition: filter 260ms ease, transform 400ms ease;
  }

  #rail.live .thumb:hover img,
  #rail.live .thumb:focus-visible img {
    filter: brightness(1.12) saturate(1.06);
    transform: scale(1.07);
  }

  #rail.live .thumb:hover,
  #rail.live .thumb:focus-visible {
    border-color: rgba(255, 214, 160, 0.75);
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.7), 0 0 22px rgba(255, 176, 90, 0.28);
    outline: none;
  }

  .thumb .n {
    position: absolute;
    inset: auto 0 0 0;
    font-size: 9px;
    letter-spacing: 0.16em;
    color: rgba(255, 255, 255, 0.72);
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.72));
    padding: 10px 0 2px;
    text-align: center;
    opacity: 0;
    transition: opacity 240ms ease;
  }

  #rail.live .thumb:hover .n,
  #rail.live .thumb:focus-visible .n { opacity: 1; }

  /* ---------- the standing caption ---------- */

  #plate-text {
    position: fixed;
    left: max(3vw, 22px);
    bottom: max(3vh, 22px);
    z-index: 3;
    font-size: 11px;
    letter-spacing: 0.2em;
    line-height: 1.9;
    text-transform: lowercase;
    color: #b8ada2;
    text-shadow: 0 1px 14px rgba(0, 0, 0, 0.9);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 1.5s ease 0.5s, transform 1.5s ease 0.5s;
    pointer-events: none;
    /* only has to clear him in the far corner now */
    max-width: calc(100vw - 260px);
  }

  body.ready #plate-text { opacity: 1; transform: none; }
  body.lit   #plate-text { opacity: 0; transition-delay: 0s; transition-duration: 400ms; }

  #plate-text .t { color: #e8dcc9; letter-spacing: 0.34em; }
  #plate-text .s { color: #978d82; font-size: 10px; }

  /* Share Tech Mono has no ¼. Name monospace fallbacks that do, so the one
     borrowed glyph still keeps the line's even advance. */
  .frac {
    font-family: Menlo, Consolas, 'DejaVu Sans Mono', monospace;
    font-size: 1.15em;
  }

  /* Him, in the corner the row used to occupy — the same treatment, still in
     the slide's own 5:4 landscape rather than cropped square. */
  #portrait {
    display: block;
    position: fixed;
    right: max(3vw, 22px);
    bottom: max(3vh, 20px);
    z-index: 3;
    width: clamp(48px, 5vw, 75px);
    aspect-ratio: 1.25;
    height: auto;
    padding: 0;
    opacity: 0;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 2px;
    background: #0a0809;
    overflow: hidden;
    cursor: pointer;
    touch-action: manipulation;
    pointer-events: auto;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.65);
    transition: opacity 1.2s ease 0.4s, border-color 260ms ease, box-shadow 260ms ease;
  }

  body.ready #portrait { opacity: 1; }
  body.lit   #portrait { opacity: 0; pointer-events: none; transition-delay: 0s; }

  #portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: brightness(0.86) saturate(0.94);
    transition: filter 260ms ease, transform 400ms ease;
  }

  body.live #portrait:hover img,
  body.live #portrait:focus-visible img {
    filter: brightness(1.12) saturate(1.06);
    transform: scale(1.07);
  }

  body.live #portrait:hover,
  body.live #portrait:focus-visible {
    border-color: rgba(255, 214, 160, 0.75);
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.7), 0 0 22px rgba(255, 176, 90, 0.28);
    outline: none;
  }

  /* ---------- the enlargement ---------- */

  #light {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    background: #0a090c;
    opacity: 0;
    pointer-events: none;
    transition: opacity 700ms ease;
    cursor: zoom-out;
  }

  body.lit #light { opacity: 1; pointer-events: auto; }

  #light img {
    max-width: 88vw;
    max-height: 86vh;
    object-fit: contain;
    display: block;
    opacity: 0;
    transform: scale(0.965);
    transition: opacity 800ms ease, transform 1100ms cubic-bezier(0.16, 0.9, 0.22, 1);
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.8);
  }

  #light img.shown { opacity: 1; transform: scale(1); }

  #light .meta {
    position: fixed;
    left: 0; right: 0; bottom: max(2.4vh, 18px);
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: lowercase;
    color: #6e6660;
    opacity: 0;
    transition: opacity 700ms ease 400ms;
  }

  body.lit #light .meta { opacity: 1; }

  /* ---------- small screens ---------- */

  /* The centred row needs no rearranging: five thumbnails at the clamp's
     54px floor with 9px gaps come to 306px, which fits a 390px phone. The
     old rules turned it into a column down the right edge — correct when it
     was a corner rail, wrong now that it is the subject and already centred.
     What does need moving is everything that used to share the corners. */
  @media (max-width: 720px) {
    #plate-text {
      font-size: 10px;
      letter-spacing: 0.16em;
      left: calc(18px + env(safe-area-inset-left, 0px));
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      /* he is above it now rather than beside it, so it can have the width */
      max-width: calc(100vw - 36px);
    }

    #portrait {
      right: calc(16px + env(safe-area-inset-right, 0px));
      bottom: calc(74px + env(safe-area-inset-bottom, 0px));
      width: 43px;
    }

    #light img  { max-width: 94vw; max-height: 78vh; }
    #light .meta { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
  }

  @media (prefers-reduced-motion: reduce) {
    .plate img { transform: none !important; transition: none !important; }
    .plate.resting img { animation: none; }
    .thumb.animate { transition: opacity 500ms ease; }
    .thumb { transform: none !important; }
    #light img { transition: opacity 400ms ease; transform: none !important; }
  }
</style>
</head>
<body>

<div id="stage" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>
<div id="shade" aria-hidden="true"></div>

<button id="portrait" type="button" aria-label="Portrait of James Vincent Moore — enlarge">
  <img src="thumbs/jimmy.jpg" alt="" decoding="async">
</button>

<div id="plate-text">
  <div class="t">light studies</div>
  <div class="s">james vincent moore (jimmy) · 2<span class="frac">¼</span>-inch film · detroit, mi · early–mid 1960s</div>
</div>

<nav id="rail" aria-label="Photographs"></nav>

<div id="light" role="dialog" aria-modal="true" aria-label="Enlargement">
  <img id="light-img" alt="">
  <div class="meta" id="light-meta"></div>
</div>

<script>
(function () {
  'use strict';

  var PHOTOS = [
    { id: '01', alt: 'Long exposure — petals of red, green and yellow light' },
    { id: '02', alt: 'Long exposure — scattered warm bokeh over deep red' },
    { id: '03', alt: 'Long exposure — looping gold and orange light trails' },
    { id: '04', alt: 'Long exposure — beaded curtains of gold light' },
    { id: '05', alt: 'Long exposure — soft amber glow scattered with sparks' }
  ];

  // Him, from the same years. Not part of the numbered five — he holds the
  // bottom-right corner alone and carries his own label in the enlargement.
  var PORTRAIT = {
    id: 'jimmy',
    alt: 'James Vincent Moore seated in a living room, early to mid 1960s',
    label: 'james vincent moore · early–mid 1960s'
  };

  // The opening: three photographs at full size and full strength, each
  // fading into the next. No burst and no growing — the movement is saved
  // for the row.
  var INTRO = ['01', '05', '02'];
  var REST  = '02';   // the one left standing, dimmed, behind the thumbnails
  var BEAT  = 2000;   // image to image
  var DWELL = 1200;   // 02 alone at full strength before the row is released

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Seen once per tab is enough; coming back from an enlargement or a reload
  // should land on the settled page.
  function seenIntro(set) {
    try {
      if (set) { sessionStorage.setItem('jimmy:intro', '1'); return true; }
      return sessionStorage.getItem('jimmy:intro') === '1';
    } catch (e) { return false; }
  }
  var stage = document.getElementById('stage');
  var rail = document.getElementById('rail');
  var light = document.getElementById('light');
  var lightImg = document.getElementById('light-img');
  var lightMeta = document.getElementById('light-meta');

  var plates = {};
  var thumbs = [];
  var current = null;
  var openItem = null;   // the photograph currently enlarged, or null
  var openIdx = -1;      // its place in PHOTOS; -1 for the portrait
  var railLive = false;
  var timers = [];

  function at(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  // The five are lights-NN; the portrait keeps its own name.
  function full(id) {
    return 'img/' + (id === PORTRAIT.id ? id : 'lights-' + id) + '.jpg';
  }

  // ---- build the background plates and the thumbnail row ----

  PHOTOS.forEach(function (p, i) {
    var plate = document.createElement('div');
    plate.className = 'plate';
    var img = document.createElement('img');
    img.src = full(p.id);
    img.alt = '';
    img.decoding = 'async';
    // Only the opening frames are worth fetching eagerly.
    img.loading = INTRO.indexOf(p.id) === -1 ? 'lazy' : 'eager';
    plate.appendChild(img);
    stage.appendChild(plate);
    plates[p.id] = plate;

    var b = document.createElement('button');
    b.className = 'thumb';
    b.type = 'button';
    b.setAttribute('aria-label', 'Photograph ' + p.id + ' of ' + PHOTOS.length);
    b.innerHTML = '<img src="thumbs/lights-' + p.id + '.jpg" alt="" decoding="async">' +
                  '<span class="n">' + p.id + '</span>';
    b.addEventListener('click', function () { if (railLive) show(p, i); });
    // Warm the enlargement before the click lands.
    b.addEventListener('mouseenter', function () { new Image().src = full(p.id); }, { once: true });
    rail.appendChild(b);
    thumbs.push(b);
  });

  function showPlate(id) {
    if (current === id) return;
    if (current) {
      var prev = plates[current];
      prev.classList.remove('on', 'resting');
      prev.classList.add('out');   // fades while still opening
    }
    plates[id].classList.remove('out');
    plates[id].classList.add('on');
    current = id;
  }

  // The row arriving is also the moment the photograph steps back.
  function land() {
    plates[REST].classList.add('resting');
    settleRail();
  }

  // ---- the opening sequence ----

  function settleRail() {
    document.body.classList.add('ready');

    // They drop straight onto the photograph, left to right. The scatter the
    // old corner rail flew in from made sense when it was travelling across
    // the screen; landing in the middle, a fall reads better than a flight.
    // Where each frame starts, as a delta from where it comes to rest.
    // glide is the one. ?entrance=<name> switches to any of the others,
    // which are kept for comparison; the settle itself — 1250ms on a long
    // ease-out — is the same for all, since that slow coming-to-rest is the
    // part that already works.
    //
    // The failure to avoid is letting the offsets scale with the index: the
    // last frame then does far more travelling than the first and reads as
    // the only thing moving. Every option below is either identical for all
    // five, or symmetric about the middle.
    var ENTRANCES = {
      // one point above the middle. Ends travel furthest, centre least, and
      // the fan is symmetric, so no single frame dominates.
      converge: function (i, n, f, r, vw, vh) {
        return { x: vw * 0.5 - (r.left + r.width / 2),
                 y: vh * 0.15 - (r.top + r.height / 2),
                 rot: (i % 2 ? 1 : -1) * 8 };
      },
      // straight down, the same distance for every frame. Only the stagger
      // separates them, which is the purest form of the lash.
      fall: function (i, n, f, r, vw, vh) {
        return { x: 0, y: -vh * 0.26, rot: (i % 2 ? 1 : -1) * 6 };
      },
      // from above with a symmetric sway — the middle swings widest, the
      // ends barely at all, like a rope shaken at both ends.
      wave: function (i, n, f, r, vw, vh) {
        var m = Math.sin(f * Math.PI);
        return { x: (i % 2 ? 1 : -1) * m * vw * 0.07,
                 y: -vh * (0.14 + m * 0.10),
                 rot: (i % 2 ? 1 : -1) * (4 + m * 9) };
      },
      // in from the left, identical distance for each. The whip is entirely
      // in the release, not in the geometry.
      sweep: function (i, n, f, r, vw, vh) {
        return { x: -vw * 0.30, y: vh * 0.07, rot: -9 };
      },
      // sweep's move over a much shorter run — in from just off the row
      // rather than a third of the screen away, with the turn eased back to
      // match. Same flat distribution, so no frame leads.
      glide: function (i, n, f, r, vw, vh) {
        return { x: -vw * 0.12, y: vh * 0.035, rot: -6 };
      },
      // the quiet one: a short fall, no turn, and the long settle alone.
      drift: function (i, n, f, r, vw, vh) {
        return { x: 0, y: -44, rot: 0 };
      },
      // the progressive trail, kept so it can be compared against the rest.
      // This is the one where the last frame does too much of the work.
      trail: function (i, n, f, r, vw, vh) {
        return { x: -vw * (0.22 + f * 0.12), y: vh * (0.15 + f * 0.07),
                 rot: (i % 2 ? 1 : -1) * (7 + i * 4) };
      }
    };

    var pick = new URLSearchParams(location.search).get('entrance');
    var enter = ENTRANCES[pick] || ENTRANCES.glide;
    if (pick && ENTRANCES[pick]) {
      var sub = document.querySelector('#plate-text .s');
      sub.textContent = sub.textContent + ' · entrance: ' + pick;
    }

    var vw = window.innerWidth, vh = window.innerHeight;
    var n = thumbs.length;

    thumbs.forEach(function (t, i) {
      var f = n > 1 ? i / (n - 1) : 0;
      var o = enter(i, n, f, t.getBoundingClientRect(), vw, vh);
      t.style.setProperty('--dx', o.x.toFixed(1) + 'px');
      t.style.setProperty('--dy', o.y.toFixed(1) + 'px');
      t.style.setProperty('--rot', o.rot.toFixed(1) + 'deg');
    });

    void rail.offsetWidth;   // lock in the start before animating

    thumbs.forEach(function (t, i) {
      t.classList.add('animate');
      at(function () { t.classList.add('settled'); }, reduced ? 0 : i * 130);
    });

    // Clickable only once the row has come to rest.
    at(function () {
      railLive = true;
      rail.classList.add('live');
      document.body.classList.add('live');
    }, reduced ? 0 : (thumbs.length - 1) * 130 + 1250);
  }

  // Skipped, deep-linked, or seen already: straight to the settled page.
  function finish() {
    clearTimers();
    seenIntro(true);
    showPlate(REST);
    land();
  }

  function run() {
    if (reduced || seenIntro()) { finish(); return; }
    seenIntro(true);
    showPlate(INTRO[0]);
    at(function () { showPlate(INTRO[1]); }, BEAT);
    at(function () { showPlate(INTRO[2]); }, BEAT * 2);
    at(land, BEAT * 2 + DWELL);
  }



  // ---- enlargement ----

  function mark(hash) {
    if (history.replaceState) history.replaceState(null, '', hash || location.pathname);
  }

  function show(item, idx) {
    openItem = item;
    openIdx = typeof idx === 'number' ? idx : -1;
    lightImg.classList.remove('shown');
    lightImg.alt = item.alt;
    lightMeta.textContent =
      item.label || (item.id + ' / ' + String(PHOTOS.length).padStart(2, '0'));
    document.body.classList.add('lit');
    mark('#' + item.id);

    var im = new Image();
    var done = false;
    im.onload = function () {
      if (done) return;
      done = true;
      lightImg.src = im.src;
      requestAnimationFrame(function () { lightImg.classList.add('shown'); });
    };
    im.src = full(item.id);
    if (im.complete) im.onload();
  }

  function close() {
    if (!openItem) return;
    openItem = null;
    openIdx = -1;
    lightImg.classList.remove('shown');
    document.body.classList.remove('lit');
    mark('');
  }

  var portrait = document.getElementById('portrait');
  portrait.addEventListener('click', function () { if (railLive) show(PORTRAIT); });
  portrait.addEventListener('mouseenter', function () {
    new Image().src = full(PORTRAIT.id);
  }, { once: true });

  light.addEventListener('click', close);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { close(); return; }
    // Arrows walk the five; the portrait sits outside that sequence.
    if (openIdx >= 0 && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      e.preventDefault();
      var n = (openIdx + (e.key === 'ArrowRight' ? 1 : PHOTOS.length - 1)) % PHOTOS.length;
      show(PHOTOS[n], n);
    }
  });

  // A click during the opening skips straight to the settled page.
  function skip(e) {
    if (railLive || openItem || current === REST) return;
    if (e.target.closest && e.target.closest('#rail, #plate-text')) return;
    finish();
  }
  document.addEventListener('click', skip);

  // ---- go, once the opening frames are actually decoded ----

  var waiting = INTRO.map(function (id) {
    var im = new Image();
    im.src = full(id);
    return im.decode ? im.decode().catch(function () {}) : Promise.resolve();
  });

  // A link straight to one photograph — /jimmy/#03, or /jimmy/#jimmy for the
  // portrait — skips the opening.
  var hash = location.hash.slice(1);
  var deep = PHOTOS.map(function (p) { return p.id; }).indexOf(hash);

  var started = false;
  function start() {
    if (started) return;
    started = true;
    if (deep >= 0) { finish(); show(PHOTOS[deep], deep); }
    else if (hash === PORTRAIT.id) { finish(); show(PORTRAIT); }
    else { run(); }
  }

  Promise.all(waiting).then(start);
  setTimeout(start, 3500); // never let a slow network hold the door
})();
</script>

</body>
</html>
